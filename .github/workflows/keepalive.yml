name: Keep Render Backend Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: curl -sSf https://uchiha-backend-d1n7.onrender.com/api/config > /dev/null || echo "Backend ping failed"
