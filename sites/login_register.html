<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCHIHA - Labs© - Login / Register</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/mobile.css">
    <link rel="stylesheet" href="../css/uchiha-theme.css">
    <link rel="icon" type="image/webp" href="../images/main/r_l_logo_1.webp">
</head>
<body>
    <div class="auth-container">
        <a href="../index.html" class="auth-back" style="display:none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"></path>
            </svg>
            Back to Store
        </a>

        <div class="auth-card">
            <img src="../images/main/r_l_logo_1.webp" alt="Logo" class="auth-logo" onerror="this.style.display='none'">
            <h1 class="auth-title">UCHIHA - Labs©</h1>
            <p class="auth-subtitle">Welcome to the future of digital products</p>

            <div class="auth-tabs" style="display:none;">
                <div id="authTabIndicator"></div>
            </div>

            <div id="authPublicNotice" class="auth-public-notice" style="display:none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <div>
                    <strong>Backend runs locally.</strong>
                    <span>To log in or create an account, please use the <a href="../index.html">UCHIHA Launcher desktop app</a> (click "Download Launcher" in the sidebar). The public website is read-only.</span>
                </div>
                <button type="button" class="auth-public-notice-close" aria-label="Dismiss">&times;</button>
            </div>

            <div style="text-align:center; padding: 20px 0;">
                <button type="button" class="auth-btn-discord" id="discordLoginBtn" style="max-width: 320px; width: 100%; margin: 0 auto; display: inline-flex;">
                    <svg viewBox="0 0 71 55" fill="currentColor" aria-hidden="true">
                        <path d="M60.1045 4.8978C55.5792 2.8214 50.7265 1.2916 45.6527 0.41542C45.5603 0.39851 45.468 0.440769 45.4204 0.525289C44.7963 1.6353 44.105 3.0834 43.6209 4.2216C38.1637 3.4046 32.7345 3.4046 27.3892 4.2216C26.905 3.0581 26.1886 1.6353 25.5617 0.525289C25.5141 0.443589 25.4218 0.40133 25.3294 0.41542C20.2584 1.2888 15.4057 2.8186 10.8776 4.8978C10.8384 4.9147 10.8048 4.9429 10.7825 4.9795C1.57795 18.7309 -0.943561 32.1443 0.293408 45.3914C0.299005 45.4562 0.335386 45.5182 0.385761 45.5576C6.45866 50.0174 12.3413 52.7249 18.1147 54.5195C18.2071 54.5477 18.305 54.5139 18.3638 54.4378C19.7295 52.5728 20.9469 50.6063 21.9907 48.5383C22.0523 48.4172 21.9935 48.2735 21.8676 48.2256C19.9366 47.4931 18.0979 46.6 16.3292 45.5858C16.1893 45.5041 16.1781 45.304 16.3068 45.2082C54.7816 45.304 54.7732 45.5041 54.6333 45.5858C52.8646 46.6197 51.0259 47.4931 49.0921 48.2228C48.9662 48.2707 48.9102 48.4172 48.9718 48.5383C50.038 50.6034 51.2554 52.5699 52.5959 54.435C52.6519 54.5139 52.7526 54.5477 52.845 54.5195C58.6464 52.7249 64.529 50.0174 70.6019 45.5576C70.6551 45.5182 70.6887 45.459 70.6943 45.3942C72.1747 30.0791 68.2147 16.7757 60.1968 4.9823C60.1772 4.9429 60.1437 4.9147 60.1045 4.8978ZM23.7259 37.3253C20.2276 37.3253 17.3451 34.1136 17.3451 30.1693C17.3451 26.225 20.1717 23.0133 23.7259 23.0133C27.3087 23.0133 30.1353 26.2532 30.1067 30.1693C30.1067 34.1136 27.2801 37.3253 23.7259 37.3253ZM47.3178 37.3253C43.8196 37.3253 40.9371 34.1136 40.9371 30.1693C40.9371 26.225 43.7636 23.0133 47.3178 23.0133C50.9006 23.0133 53.7272 26.2532 53.6986 30.1693C53.6986 34.1136 50.9006 37.3253 47.3178 37.3253Z"/>
                    </svg>
                    Continue with Discord
                </button>
            </div>

            <form id="loginForm" autocomplete="on" style="display:none;">
                <div id="login-form">
                    <div class="form-group">
                        <label for="login-username-email">Username or Email</label>
                        <input type="text" id="login-username-email" name="username_email" class="form-control" placeholder="Enter your username or email" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <div class="input-group">
                            <input type="password" id="login-password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                            <button type="button" class="toggle-password" data-target="login-password" aria-label="Toggle password visibility">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="auth-btn">Sign In</button>

                    <div class="auth-divider">or</div>

                    <button type="button" class="auth-btn-discord" id="discordLoginBtn">
                        <svg viewBox="0 0 71 55" fill="currentColor" aria-hidden="true">
                            <path d="M60.1045 4.8978C55.5792 2.8214 50.7265 1.2916 45.6527 0.41542C45.5603 0.39851 45.468 0.440769 45.4204 0.525289C44.7963 1.6353 44.105 3.0834 43.6209 4.2216C38.1637 3.4046 32.7345 3.4046 27.3892 4.2216C26.905 3.0581 26.1886 1.6353 25.5617 0.525289C25.5141 0.443589 25.4218 0.40133 25.3294 0.41542C20.2584 1.2888 15.4057 2.8186 10.8776 4.8978C10.8384 4.9147 10.8048 4.9429 10.7825 4.9795C1.57795 18.7309 -0.943561 32.1443 0.293408 45.3914C0.299005 45.4562 0.335386 45.5182 0.385761 45.5576C6.45866 50.0174 12.3413 52.7249 18.1147 54.5195C18.2071 54.5477 18.305 54.5139 18.3638 54.4378C19.7295 52.5728 20.9469 50.6063 21.9907 48.5383C22.0523 48.4172 21.9935 48.2735 21.8676 48.2256C19.9366 47.4931 18.0979 46.6 16.3292 45.5858C16.1893 45.5041 16.1781 45.304 16.3068 45.2082C54.7816 45.304 54.7732 45.5041 54.6333 45.5858C52.8646 46.6197 51.0259 47.4931 49.0921 48.2228C48.9662 48.2707 48.9102 48.4172 48.9718 48.5383C50.038 50.6034 51.2554 52.5699 52.5959 54.435C52.6519 54.5139 52.7526 54.5477 52.845 54.5195C58.6464 52.7249 64.529 50.0174 70.6019 45.5576C70.6551 45.5182 70.6887 45.459 70.6943 45.3942C72.1747 30.0791 68.2147 16.7757 60.1968 4.9823C60.1772 4.9429 60.1437 4.9147 60.1045 4.8978ZM23.7259 37.3253C20.2276 37.3253 17.3451 34.1136 17.3451 30.1693C17.3451 26.225 20.1717 23.0133 23.7259 23.0133C27.3087 23.0133 30.1353 26.2532 30.1067 30.1693C30.1067 34.1136 27.2801 37.3253 23.7259 37.3253ZM47.3178 37.3253C43.8196 37.3253 40.9371 34.1136 40.9371 30.1693C40.9371 26.225 43.7636 23.0133 47.3178 23.0133C50.9006 23.0133 53.7272 26.2532 53.6986 30.1693C53.6986 34.1136 50.9006 37.3253 47.3178 37.3253Z"/>
                        </svg>
                        Continue with Discord
                    </button>

                    <a href="#" id="forgotPasswordLink" class="auth-alt-link" style="display:none;">Forgot password?</a>
                </div>
            </form>

            <form id="registerForm" autocomplete="on" style="display:none;">
                <div id="register-form">
                    <div class="form-group">
                        <label for="register-username">Username</label>
                        <input type="text" id="register-username" name="username" class="form-control" placeholder="Choose a username" required pattern="^[A-Za-z][A-Za-z0-9_.\-]{6,19}$" autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="register-email">Email Address</label>
                        <input type="email" id="register-email" name="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="register-phone">Phone Number</label>
                        <input type="tel" id="register-phone" name="phone" class="form-control" placeholder="Optional" autocomplete="tel">
                    </div>

                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <div class="input-group">
                            <input type="password" id="register-password" name="password" class="form-control" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
                            <button type="button" class="toggle-password" data-target="register-password" aria-label="Toggle password visibility">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="register-confirm-password">Confirm Password</label>
                        <div class="input-group">
                            <input type="password" id="register-confirm-password" name="confirm_password" class="form-control" placeholder="Repeat your password" required minlength="6" autocomplete="new-password">
                            <button type="button" class="toggle-password" data-target="register-confirm-password" aria-label="Toggle password visibility">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="auth-btn">Create Account</button>
                </div>
            </form>

            <div id="forgotPasswordSection" style="display:none;">
                <a href="#" id="forgotBackLink" class="auth-back">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 18l-6-6 6-6"></path>
                    </svg>
                    Back to Login
                </a>

                <form id="forgotPasswordForm">
                    <div class="form-group">
                        <label for="forgot-identifier">Username or Email</label>
                        <input type="text" id="forgot-identifier" name="identifier" class="form-control" placeholder="Enter your username or email" required>
                    </div>
                    <button type="submit" class="auth-btn">Send Reset Code</button>
                </form>

                <form id="resetCodeForm" style="display:none;">
                    <input type="hidden" id="reset-identifier">
                    <div class="form-group">
                        <label for="reset-code">Reset Code</label>
                        <input type="text" id="reset-code" name="code" class="form-control" placeholder="Enter the code you received" required>
                    </div>
                    <div class="form-group">
                        <label for="reset-new-password">New Password</label>
                        <div class="input-group">
                            <input type="password" id="reset-new-password" name="new_password" class="form-control" placeholder="At least 6 characters" required minlength="6">
                            <button type="button" class="toggle-password" data-target="reset-new-password" aria-label="Toggle password visibility">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="reset-confirm-password">Confirm New Password</label>
                        <div class="input-group">
                            <input type="password" id="reset-confirm-password" name="confirm_new_password" class="form-control" placeholder="Repeat your new password" required minlength="6">
                            <button type="button" class="toggle-password" data-target="reset-confirm-password" aria-label="Toggle password visibility">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="auth-btn">Reset Password</button>
                </form>
            </div>
        </div>
    </div>

<script src="../js/main.js"></script>
    <script>
    (function() {
        document.addEventListener('DOMContentLoaded', function() {
            var discordBtn = document.getElementById('discordLoginBtn');
            if (discordBtn) {
                discordBtn.addEventListener('click', function() {
                    var returnTo = encodeURIComponent(window.location.origin + '/index.html');
                    window.location.href = (typeof apiUrl === 'function' ? apiUrl('/api/auth/discord') : '/api/auth/discord') + '?return_to=' + returnTo;
                });
            }

            document.querySelectorAll('.toggle-password').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var inp = document.getElementById(btn.getAttribute('data-target'));
                    if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
                });
            });
        });
    })();
    </script>
    <script>
    (function() {
        function syncAuthForms() {
            var activeTab = document.querySelector('.auth-tab.active');
            var tabName = activeTab ? activeTab.getAttribute('data-tab') : 'login';
            var loginForm = document.getElementById('login-form');
            var registerForm = document.getElementById('register-form');
            var registerFormEl = document.getElementById('registerForm');
            var loginFormEl = document.getElementById('loginForm');
            var forgotSection = document.getElementById('forgotPasswordSection');

            var showRegister = tabName === 'register';
            if (loginFormEl) loginFormEl.style.display = showRegister ? 'none' : '';
            if (registerFormEl) registerFormEl.style.display = showRegister ? '' : 'none';
            if (loginForm) loginForm.style.display = showRegister ? 'none' : '';
            if (registerForm) registerForm.style.display = showRegister ? '' : 'none';
            if (forgotSection) forgotSection.style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', function() {
            syncAuthForms();
            document.querySelectorAll('.auth-tab').forEach(function(tab) {
                tab.addEventListener('click', function() {
                    setTimeout(syncAuthForms, 0);
                });
            });
            var params = new URLSearchParams(window.location.search);
            if (params.get('tab') === 'register') {
                setTimeout(syncAuthForms, 0);
            }
            // Public-site notice: backend is now hosted publicly on Render,
            // so login works on the website too. Notice is hidden by default.
            // (Kept in the DOM so it can be shown if the backend is offline.)
        });
    })();
    </script>
</body>

</html>
