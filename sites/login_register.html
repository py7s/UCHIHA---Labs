<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCHIHA - Labs© - Login</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/mobile.css">
    <link rel="stylesheet" href="../css/uchiha-theme.css">
    <link rel="icon" type="image/webp" href="../images/main/r_l_logo_1.webp">
</head>
<body>
    <div class="auth-container">
        <a href="../index.html" class="auth-back" style="display:none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"></path>
            </svg>
            Back to Store
        </a>

        <div class="auth-card">
            <img src="../images/main/r_l_logo_1.webp" alt="Logo" class="auth-logo" onerror="this.style.display='none'">
            <h1 class="auth-title">UCHIHA - Labs©</h1>
            <p class="auth-subtitle">Welcome to the future of digital products</p>

            <div class="auth-tabs" style="display:none;">
                <div id="authTabIndicator"></div>
            </div>

            <div id="authPublicNotice" class="auth-public-notice" style="display:none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <div>
                    <strong>Backend runs locally.</strong>
                    <span>To log in or create an account, please use the <a href="../index.html">UCHIHA Launcher desktop app</a> (click "Download Launcher" in the sidebar). The public website is read-only.</span>
                </div>
                <button type="button" class="auth-public-notice-close" aria-label="Dismiss">&times;</button>
            </div>

            <div style="text-align:center; padding: 20px 0;">
                <button type="button" class="auth-btn-discord" id="discordLoginBtn" style="max-width: 320px; width: 100%; margin: 0 auto; display: inline-flex;">
                    <svg viewBox="0 0 71 55" fill="currentColor" aria-hidden="true">

                    </svg>
                    Continue with Discord
                </button>
            </div>
        </div>
    </div>

<script src="../js/main.js"></script>
    <script>
    (function() {
        document.addEventListener('DOMContentLoaded', function() {
            var discordBtn = document.getElementById('discordLoginBtn');
            if (discordBtn) {
                discordBtn.addEventListener('click', function() {
                    var returnTo = encodeURIComponent(window.location.origin + '/index.html');
                    window.location.href = 'https://uchiha-backend-d1n7.onrender.com/api/auth/discord?return_to=' + returnTo;
                });
            }
        });
    })();
    </script>
</body>

</html>
